[alembic]
script_location = migrations

# Revisions are grouped by schema area. `alembic revision` picks the target
# directory with --version-path, e.g.
#   uv run alembic revision -m "add users" --version-path migrations/versions/identity
version_locations = migrations/versions/identity migrations/versions/tenancy migrations/versions/catalog migrations/versions/integration migrations/versions/market migrations/versions/analytics migrations/versions/content migrations/versions/copilot migrations/versions/audit migrations/versions/signals migrations/versions/stryx migrations/versions/settings

# Timestamped, slugged filenames keep the versions directories readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = src
# Applies to version_locations as well as prepend_sys_path; 'os' would split
# the list on ';' on Windows and treat the whole line as one path.
path_separator = space
timezone = UTC

# The URL is supplied by migrations/env.py from application settings
# (DATABASE_URL). It is intentionally left blank here so credentials never
# live in a committed file.
sqlalchemy.url =

[post_write_hooks]
# `exec` rather than `console_scripts`: ruff is a standalone binary in the uv
# environment, not an installed console-script entry point.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
