[project]
name = "marketcompass"
version = "0.1.0"
description = "MarketCompass — options & futures market intelligence terminal"
# Inlined rather than a path: the project README lives at the repo root
# (../README.md), which is outside this package directory, so a wheel/sdist
# build (as `uv sync`/`uv run` performs) rejects it. The docs live at the repo
# root; this keeps the package buildable.
readme = { text = "MarketCompass backend — options & futures market intelligence terminal. See the repository root README for full documentation.", content-type = "text/markdown" }
requires-python = ">=3.13"

dependencies = [
    # --- web / api -------------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    # --- persistence -----------------------------------------------------
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # --- cache / messaging ----------------------------------------------
    "redis[hiredis]>=5.2",
    "celery[redis]>=5.4",
    # --- outbound --------------------------------------------------------
    "httpx>=0.28",
    "tenacity>=9.0",
    "websockets>=14.1",
    # NSE publishes its FII derivative statistics as a legacy BIFF workbook —
    # the one file in the FII/DII pipeline that is not CSV or JSON.
    "xlrd>=2.0.1",
    # --- security --------------------------------------------------------
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "pyjwt>=2.10",
    # --- observability ---------------------------------------------------
    "structlog>=24.4",
    "orjson>=3.10",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
# Generative LLM providers for the AI guider's copilot layer. Optional: with
# neither installed the app runs on the rule-based provider (the default), and
# the provider factory degrades gracefully when a package is absent. Install to
# enable MC_LLM_PROVIDER=anthropic|openai:  uv sync --extra llm
llm = [
    "anthropic>=0.40",
    "openai>=1.60",
]
# The agentic AI Console (Hella) — a LangGraph planner→executor over read-only
# market-data tools. LLM-only: with no key the Agent tab is disabled rather than
# degrading. langchain-anthropic pulls the anthropic SDK transitively. Session
# memory uses the app's own plain-Redis store (no RedisStack checkpointer needed).
# Install with:  uv sync --extra agent
agent = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-anthropic>=0.3.0",
]

[project.scripts]
marketcompass-api = "marketcompass.entrypoints.main_api:run"
marketcompass-ingest = "marketcompass.entrypoints.main_ingest:run"
marketcompass-catalog = "marketcompass.entrypoints.main_catalog:run"
marketcompass-futures-oi = "marketcompass.entrypoints.main_futures_oi:run"
marketcompass-futures-history = "marketcompass.entrypoints.main_futures_history:run"
marketcompass-oi = "marketcompass.entrypoints.main_oi_data:run"
marketcompass-signals = "marketcompass.entrypoints.main_signals:run"
marketcompass-hugin = "marketcompass.entrypoints.main_hugin:run"
marketcompass-mme100 = "marketcompass.entrypoints.main_mme100:run"
marketcompass-report = "marketcompass.entrypoints.main_report:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "anyio>=4.7",
    "hypothesis>=6.122",
    "faker>=33.1",
    "testcontainers[postgres,redis]>=4.9",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.14",
    "import-linter>=2.1",
    "httpx2>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketcompass"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Architecture rules — enforced in CI alongside tests/architecture/.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "marketcompass"
# Required because the domain-purity contract names third-party modules.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer is pure"
type = "forbidden"
source_modules = ["marketcompass.shared_kernel.domain"]
forbidden_modules = [
    "marketcompass.infrastructure",
    "sqlalchemy",
    "fastapi",
    "redis",
    "celery",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Infrastructure never imports composition roots"
type = "forbidden"
source_modules = ["marketcompass.infrastructure"]
forbidden_modules = ["marketcompass.entrypoints", "marketcompass.bootstrap"]

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent"
type = "independence"
# The AI Console (copilot) reasons over live market data it does not own. Like
# every cross-context need, the wiring is a sanctioned bridge in infrastructure
# (`infrastructure/agent/langgraph/build.py`), which reads market_data and
# options_analytics services and returns a copilot `AgentPort`. copilot imports
# only that bridge, never those contexts directly; this exempts the bridge edge
# so the transitive reach isn't counted as copilot depending on them.
ignore_imports = [
    "marketcompass.contexts.copilot.api.dependencies -> marketcompass.infrastructure.agent.langgraph.build",
    # STRYX uses the same sanctioned bridge as copilot: its dependency imports
    # only `build_stryx`, which reads market_data/options_analytics services (and
    # the shared agent tools) and returns a stryx `AgentPort`. Exempt the bridge
    # edge so the transitive reach isn't counted as stryx depending on them.
    "marketcompass.contexts.stryx.api.dependencies -> marketcompass.infrastructure.agent.langgraph.build_stryx",
    # HUGIN uses the same sanctioned-bridge pattern: its API dependency imports
    # only `build_hugin`, which assembles the read services (and, later, the cycle
    # ports) from the container. Exempt that single edge so the transitive reach
    # isn't counted as hugin depending on other contexts or infrastructure.
    "marketcompass.contexts.hugin.api.dependencies -> marketcompass.infrastructure.hugin.build_hugin",
    # MME100 uses the same sanctioned-bridge pattern: its API dependency imports
    # only `build_mme100`, which assembles the chat/read services (and the worker's
    # agent + directory + briefing store) from the container. Exempt that single
    # edge so the transitive reach isn't counted as mme100 depending on other
    # contexts or infrastructure.
    "marketcompass.contexts.mme100.api.dependencies -> marketcompass.infrastructure.mme100.build_mme100",
    # Messaging uses the same sanctioned-bridge pattern: its API dependency imports
    # only `build_messaging`, which assembles the channel repository + adapters from
    # the container. Exempt that single edge.
    "marketcompass.contexts.messaging.api.dependencies -> marketcompass.infrastructure.messaging.build_messaging",
    # Futures analytics uses the same sanctioned-bridge pattern: its API
    # dependency imports only `build_futures_services`, which assembles the
    # broker resolver, the mock fallback and the instrument catalog into a
    # futures_analytics `FuturesBoardSource`. The context owns the build-up
    # maths and declares the port; only the bridge knows market_data exists.
    "marketcompass.contexts.futures_analytics.api.dependencies -> marketcompass.infrastructure.futures.build_futures",
    # Market breadth uses the same sanctioned-bridge pattern: its API dependency
    # imports only `build_breadth_services`, which assembles the futures board,
    # the index weight table and the flow placeholder into market_breadth ports.
    # The context owns the breadth, contribution and rotation maths; only the
    # bridge knows the catalog and futures_analytics exist.
    "marketcompass.contexts.market_breadth.api.dependencies -> marketcompass.infrastructure.breadth.build_breadth",
    # Report uses the same sanctioned-bridge pattern: its API dependency imports
    # only `build_report`, which assembles the data gatherer, narrator, renderer and
    # enrollment store from the container. Exempt that single edge.
    "marketcompass.contexts.report.api.dependencies -> marketcompass.infrastructure.report.build_report",
    # Global markets uses the same sanctioned-bridge pattern: its API dependency
    # imports only `build_global_services`, which assembles the Yahoo quote
    # source, the simulated fallback, the GIFT adapter and the Redis journal
    # from the container. The context owns the handoff maths; only the bridge
    # knows which provider is behind the port.
    "marketcompass.contexts.global_markets.api.dependencies -> marketcompass.infrastructure.global_markets.build_global",
]
modules = [
    "marketcompass.contexts.identity",
    "marketcompass.contexts.tenancy",
    "marketcompass.contexts.entitlements",
    "marketcompass.contexts.billing",
    "marketcompass.contexts.preferences",
    "marketcompass.contexts.instrument_catalog",
    "marketcompass.contexts.broker_connections",
    "marketcompass.contexts.ai_settings",
    "marketcompass.contexts.market_ingestion",
    "marketcompass.contexts.market_data",
    "marketcompass.contexts.options_analytics",
    "marketcompass.contexts.futures_analytics",
    "marketcompass.contexts.market_breadth",
    "marketcompass.contexts.global_markets",
    "marketcompass.contexts.signals",
    "marketcompass.contexts.outcomes",
    "marketcompass.contexts.content_intelligence",
    "marketcompass.contexts.copilot",
    "marketcompass.contexts.stryx",
    "marketcompass.contexts.hugin",
    "marketcompass.contexts.mme100",
    "marketcompass.contexts.messaging",
    "marketcompass.contexts.report",
    "marketcompass.contexts.realtime_delivery",
    "marketcompass.contexts.audit",
]
