[pytest]
testpaths = tests
pythonpath = src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    --strict-markers
    --strict-config
    -ra
    --import-mode=importlib

markers =
    unit: pure in-process tests, no I/O (default for tests/unit)
    integration: requires Postgres, Redis, or another live dependency
    contract: verifies a published contract in contracts/
    architecture: enforces layering and dependency rules
    security: authn/authz and tenant-isolation checks
    performance: latency or throughput budgets, excluded from the default run
    slow: takes more than a second

filterwarnings =
    error
    ignore::DeprecationWarning:celery.*
    ignore::DeprecationWarning:kombu.*

log_cli_level = WARNING
