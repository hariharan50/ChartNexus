# Shared by every location that proxies to the FastAPI process. nginx location
# blocks do not inherit from one another, so without this the whole set has to
# be repeated per route — and a header forgotten in one copy is the kind of
# difference nothing fails loudly about.

# Via a variable, so nginx re-resolves `api` through the resolver in nginx.conf
# instead of pinning the address it had at startup. A named upstream block
# cannot be used for this: nginx has no DNS to apply to it, which is the whole
# problem. The cost is the upstream keepalive pool, which on a local bridge
# network is worth little next to not serving 502s after a deploy.
set $api_upstream "api:8000";
proxy_pass http://$api_upstream;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;
# Empty, not "close": the client's own Connection header must not be
# forwarded to the upstream.
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
# The API's own request budget is 30s (CN_REQUEST_TIMEOUT_SECONDS); the proxy
# waits longer so a slow call surfaces as the application's error rather than a
# bare 504 with nothing in the app logs to match it.
proxy_read_timeout    60s;

# Five headers are set in two places: by the app, and by this server block's
# `add_header` for the HTML it serves. nginx would pass both through, joined
# with a comma, which a browser treats as one unparseable value. Dropping the
# upstream's copy leaves exactly one of each.
#
# Content-Security-Policy is deliberately absent from this list: nginx does not
# set one, and the app's — far stricter, since a JSON response should be able to
# do nothing at all — has to reach the client intact.
proxy_hide_header X-Frame-Options;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Permissions-Policy;
