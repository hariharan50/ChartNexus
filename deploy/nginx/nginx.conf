# Edge proxy for the single-origin deployment.
#
# The browser bundle calls `/api/v1/...` as a same-origin path (see
# frontend/.env.example) so the session cookie needs no cross-origin
# credentials. That only works if something in front maps one hostname onto
# two upstreams, which is this file's whole job: `/api/v1` to the FastAPI
# process, everything else to the React Router server.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # `request_id` is nginx's own; the API echoes an inbound X-Request-ID back
    # when it is well formed, so one id spans the proxy log and the app log.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'uct=$upstream_connect_time urt=$upstream_response_time '
                      'rid=$request_id';
    access_log  /var/log/nginx/access.log main;

    server_tokens       off;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    types_hash_max_size 2048;

    # Longer than the API's own 30s request budget, so a slow analytics call
    # fails with the API's error rather than the proxy's 504.
    keepalive_timeout   75s;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Nothing in this application uploads; the largest body is a JSON payload.
    client_max_body_size 2m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    # Rate limits. Keyed on the real client address, which `real_ip` below
    # recovers from the X-Forwarded-For a cloud load balancer may add; with no
    # such hop the key is the connecting address and the header is ignored.
    #
    # `login` is deliberately tight: the application already throttles failures
    # per account, and this covers the other shape — one address walking many
    # accounts, which a per-account counter cannot see.
    limit_req_zone  $binary_remote_addr  zone=api:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m rate=12r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr  zone=conn:10m;
    limit_conn_status 429;

    # Only trust a forwarded address from a private range — a hop we put there.
    # A header from the open internet is whatever the client chose to claim.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS server. Needed because nginx resolves a hostname in
    # a `proxy_pass` ONCE, at startup, and caches the address for the life of
    # the process — so any `docker compose up -d` that recreates `api` or `web`
    # without also recreating nginx leaves it dialling an address nothing is
    # listening on, and the site answers 502 until nginx is restarted by hand.
    # That happens on a routine deploy, which is why it is worth the trouble.
    #
    # The fix has two halves: this resolver, and a *variable* in every
    # proxy_pass (see snippets/proxy-api.conf) — nginx only re-resolves when the
    # upstream host comes from a variable. `valid=10s` caps how long a stale
    # answer can be reused; Docker's own records have no useful TTL.
    #
    # ipv6=off because the compose network is IPv4-only: without it a returned
    # AAAA record produces a connection attempt that can only fail.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # `$connection_upgrade` is empty for an ordinary request and "upgrade" for a
    # websocket handshake, so one proxy block serves both.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include /etc/nginx/conf.d/*.conf;
}
