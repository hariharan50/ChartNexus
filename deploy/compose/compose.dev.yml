# Application services for local development, layered over compose.yml.
#
#   docker compose -f deploy/compose/compose.yml -f deploy/compose/compose.dev.yml up
#
# Source is bind-mounted and both servers hot-reload, so a code change does not
# require an image rebuild.

name: chartnexus

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      target: development
    command: >
      uv run uvicorn chartnexus.entrypoints.main_api:create_app
      --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    environment: &backend-env
      CN_ENVIRONMENT: local
      CN_DEBUG: "true"
      CN_DB_URL: postgresql+asyncpg://chartnexus:chartnexus@postgres:5432/chartnexus
      CN_REDIS_URL: redis://redis:6379/0
      CN_OTEL_LOG_FORMAT: console
      CN_SECURITY_COOKIE_SECURE: "false"
      CN_BROKER_PROVIDER: ${CN_BROKER_PROVIDER:-mock}
      # The `ingest` service below is the archive's only writer. Left at its
      # default the API would run a second capture loop inside its own
      # lifespan (LOCAL auto-start), so every tick was fetched twice and the
      # two loops split one broker rate budget. Only `main_api` reads this,
      # so the standalone worker is unaffected.
      CN_MARKET_INGEST_IN_PROCESS: "false"
      # LLM keys are per-user (set in-app at Settings -> AI, stored encrypted),
      # so no CN_LLM_* provider/key is injected here. Operational knobs
      # (CN_LLM_MAX_OUTPUT_TOKENS, CN_LLM_REQUEST_TIMEOUT_SECONDS,
      # CN_LLM_AGENT_DISCLAIMER) default sensibly and can be added if needed.
    volumes:
      - ../../backend/src:/app/src:ro
      - ../../backend/migrations:/app/migrations:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  ingest:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      target: development
    command: uv run python -m chartnexus.entrypoints.main_ingest
    environment:
      <<: *backend-env
      # Dev only. Without it a developer with no FYERS connection gets
      # `skipped_mock` on every tick forever, the archive stays empty, and the
      # Open Interest timeline has nothing to scrub over.
      CN_MARKET_INGEST_ALLOW_MOCK: "true"
      # Back to the 180s default, and not a free choice: `["*"]` below is ~220
      # symbols, one broker call each per tick, and the client is capped at
      # 8 req/s — a single pass needs ~28s of wall clock. At 60s that is half
      # the window spent fetching with nothing left for retries, and ~83k
      # calls/day against the 100k quota. At 180s it is ~27.5k/day.
      CN_MARKET_SNAPSHOT_INTERVAL_SECONDS: "180"
      # Every instrument, indices and stocks alike. Without this the archive
      # holds indices only, and every Options Lab series for a stock degrades
      # to the two-point `live_proxy` estimate — the straight 9:15-to-now line.
      # Resolved from the catalog per tick, so it tracks the F&O list rather
      # than freezing today's names. Narrow it to a JSON list of symbols if the
      # quota gets tight.
      CN_MARKET_INGEST_SYMBOLS: '["*"]'
    volumes:
      - ../../backend/src:/app/src:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # No `profiles` key on purpose: this is the only writer of the option-chain
    # archive, so a plain `up` that never starts it leaves the OI tool
    # permanently on its two-point live estimate. A service with no profile
    # starts under every profile, so `up --profile full` is unaffected.
    restart: unless-stopped

  score:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      target: development
    command: uv run python -m chartnexus.entrypoints.main_score
    environment: *backend-env
    volumes:
      - ../../backend/src:/app/src:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["full"]

  realtime:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      target: development
    command: uv run python -m chartnexus.entrypoints.main_realtime
    environment: *backend-env
    volumes:
      - ../../backend/src:/app/src:ro
    ports:
      - "8001:8001"
    depends_on:
      redis: { condition: service_healthy }
    profiles: ["full"]

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
      target: development
    command: pnpm dev --host 0.0.0.0 --port 5173
    environment:
      PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      PUBLIC_WS_URL: ws://localhost:8001/ws
      # The two above are browser-visible and resolve from the host. A loader
      # runs inside this container, where `localhost:8000` is its own loopback
      # and nothing is listening — which failed every SSR render with
      # ECONNREFUSED rather than anything that named the cause. Same reason
      # compose.prod.yml sets it; dev simply never did.
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ../../frontend:/app
      # Keep the container's own node_modules — the host tree is built for
      # Windows and its native binaries will not run on Linux.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
