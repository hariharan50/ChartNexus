# Secrets, dependency advisories, and container CVEs.
#
# Also runs on a schedule: a dependency that was clean when it merged becomes
# vulnerable later without anyone touching the repository, and that is the case
# this catches.
name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:00 UTC on Mondays — 08:30 IST, before the market opens.
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the working tree: a secret that was
          # committed and then deleted is still in the pack and still leaked.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-dependencies:
    name: python advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Audited from the lockfile rather than an installed environment, so the
      # versions checked are exactly the ones a deploy would get. --all-extras
      # because the LLM SDKs are installed in production and so are in scope.
      - name: Export the locked dependency set
        run: uv export --frozen --all-extras --no-hashes --no-emit-project -o /tmp/requirements.txt

      - name: pip-audit
        run: uvx pip-audit --strict --progress-spinner=off --requirement /tmp/requirements.txt

  node-dependencies:
    name: node advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # package_json_file because `defaults.run.working-directory` applies to
      # `run:` steps only: an action step still resolves paths from the repo
      # root, where there is no package.json to read `packageManager` from.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only high and critical fail the build. A moderate advisory in a dev-only
      # transitive dependency is worth seeing, not worth blocking a release on.
      - name: pnpm audit
        run: pnpm audit --audit-level high --prod

  images:
    name: container CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/docker/backend.Dockerfile
            target: runtime
            cache: true
          - name: web
            dockerfile: deploy/docker/frontend.Dockerfile
            target: runtime
            cache: true
          # Built without a layer cache, unlike the other two. Its only mutable
          # content is the `apk upgrade` in its Dockerfile, and that layer is
          # keyed on the instruction text alone: once a builder has run it the
          # layer is reused for as long as the base image digest holds, so the
          # image keeps shipping whatever package set existed when the layer was
          # first built. That is how CVE-2026-77214 failed this job while Alpine
          # had already published the fixed libexpat — the scan was measuring a
          # months-old upgrade. The build is a base pull plus an upgrade, so
          # rebuilding it every run costs well under a minute, and it also means
          # a re-run picks up a fix published minutes ago.
          - name: nginx
            dockerfile: deploy/docker/nginx.Dockerfile
            target: ''
            cache: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          tags: chartnexus/${{ matrix.name }}:scan
          cache-from: ${{ matrix.cache && format('type=gha,scope={0}', matrix.name) || '' }}
          cache-to: ${{ matrix.cache && format('type=gha,scope={0},mode=max', matrix.name) || '' }}

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chartnexus/${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          # Only what a base-image bump or a dependency upgrade can actually
          # fix; an unfixed CVE is noise in a required check.
          ignore-unfixed: true
          exit-code: '1'
