# Developer commands. Requires go-task: https://taskle.dev/installation
#   winget install Task.Task     (or: scoop install task)
#
# Every task below is a thin wrapper — each underlying command is short enough
# to run by hand if you would rather not install go-task.

version: "3"

vars:
  BACKEND: backend
  FRONTEND: frontend
  COMPOSE: docker compose

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # --- environment ---------------------------------------------------------
  setup:
    desc: Install all dependencies and create .env files from the examples
    cmds:
      - task: setup:env
      - cd {{.BACKEND}} && uv sync
      - cd {{.FRONTEND}} && pnpm install

  setup:env:
    desc: Create .env files from .env.example where they do not exist
    cmds:
      - cmd: test -f backend/.env || cp backend/.env.example backend/.env
        ignore_error: true
      - cmd: test -f frontend/.env || cp frontend/.env.example frontend/.env
        ignore_error: true

  up:
    desc: Start Postgres and Redis
    cmds:
      - "{{.COMPOSE}} -f deploy/compose/compose.yml up -d"

  up:full:
    desc: Start the whole stack in containers, including ingest/score/realtime
    cmds:
      - "{{.COMPOSE}} --profile full up -d --build"

  down:
    desc: Stop all containers
    cmds:
      - "{{.COMPOSE}} down"

  reset:
    desc: Stop everything and delete the database and cache volumes
    prompt: This deletes all local data. Continue?
    cmds:
      - "{{.COMPOSE}} down -v"

  logs:
    desc: Tail container logs
    cmds:
      - "{{.COMPOSE}} logs -f {{.CLI_ARGS}}"

  # --- run -----------------------------------------------------------------
  dev:
    desc: Run the API and the snapshot ingest worker against containerised dependencies
    deps: [up]
    cmds:
      - task: dev:processes

  # Both children are long-running, and go-task runs `deps` in parallel — so this
  # task never "finishes", which is the point. Ctrl+C stops both.
  #
  # Ingest belongs here rather than behind a compose profile: it is the only
  # writer of the option-chain archive, and without it the Open Interest page
  # polls every 15s forever and receives identical bytes, which reads as a frozen
  # page rather than as missing data.
  dev:processes:
    internal: true
    deps: [dev:api, dev:ingest]

  dev:api:
    desc: Run the API with hot reload
    dir: "{{.BACKEND}}"
    # This task pairs with dev:ingest, which runs the capture loop as its own
    # process. Turn the API's local in-process loop off so the two do not both
    # write and double the archive's density. Running the API on its own (outside
    # `task dev`) leaves the in-process loop on, so those charts still populate.
    env:
      MC_MARKET_INGEST_IN_PROCESS: "false"
    cmds:
      - uv run uvicorn marketcompass.entrypoints.main_api:create_app --factory --reload --port 8000

  dev:ingest:
    desc: Run the option-chain snapshot worker
    dir: "{{.BACKEND}}"
    # Set here rather than in .env so they cannot leak anywhere else. Storing
    # simulated open interest must stay off by default — see main_oi_data.py.
    env:
      MC_MARKET_INGEST_ALLOW_MOCK: "true"
      MC_MARKET_SNAPSHOT_INTERVAL_SECONDS: "60"
    cmds:
      - uv run marketcompass-ingest

  dev:web:
    desc: Run the React Router dev server
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm dev

  # --- database ------------------------------------------------------------
  db:migrate:
    desc: Apply all pending migrations
    dir: "{{.BACKEND}}"
    cmds:
      - uv run alembic upgrade head

  db:rollback:
    desc: Roll back the most recent migration
    dir: "{{.BACKEND}}"
    cmds:
      - uv run alembic downgrade -1

  db:revision:
    desc: 'Autogenerate a migration: task db:revision -- "add users" identity'
    dir: "{{.BACKEND}}"
    cmds:
      - uv run alembic revision --autogenerate -m {{.CLI_ARGS}}

  db:current:
    desc: Show the applied revision
    dir: "{{.BACKEND}}"
    cmds:
      - uv run alembic current --verbose

  # --- option-chain archive ------------------------------------------------
  oi:seed:
    desc: 'Fabricate a trading session of OI snapshots so the timeline can be scrubbed: task oi:seed -- --replace'
    dir: "{{.BACKEND}}"
    cmds:
      - uv run marketcompass-oi seed {{.CLI_ARGS}}

  oi:prune:
    desc: Apply the OI snapshot retention window
    dir: "{{.BACKEND}}"
    cmds:
      - uv run marketcompass-oi prune {{.CLI_ARGS}}

  # --- quality -------------------------------------------------------------
  check:
    desc: Run every check CI runs
    cmds:
      - task: lint
      - task: types
      - task: test

  lint:
    desc: Lint and format-check both sides
    cmds:
      - cd {{.BACKEND}} && uv run ruff check . && uv run ruff format --check .
      - cd {{.FRONTEND}} && pnpm lint

  format:
    desc: Apply formatting to both sides
    cmds:
      - cd {{.BACKEND}} && uv run ruff check --fix . && uv run ruff format .
      - cd {{.FRONTEND}} && pnpm format

  types:
    desc: Type-check both sides
    cmds:
      - cd {{.BACKEND}} && uv run mypy
      - cd {{.FRONTEND}} && pnpm typecheck

  test:
    desc: Run unit and architecture tests (no containers needed)
    cmds:
      - cd {{.BACKEND}} && uv run pytest tests/unit tests/architecture
      - cd {{.FRONTEND}} && pnpm test

  test:integration:
    desc: Run integration tests against the containerised dependencies
    deps: [up]
    dir: "{{.BACKEND}}"
    cmds:
      - uv run pytest tests/integration -m integration

  test:e2e:
    desc: Run Playwright end-to-end tests
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm test:e2e

  test:eval:
    desc: 'Run the LLM-backed agent evals (needs MC_LLM_ANTHROPIC_API_KEY): task test:eval'
    dir: "{{.BACKEND}}"
    cmds:
      - uv run --extra agent pytest tests/eval -m eval {{.CLI_ARGS}}

  arch:
    desc: Enforce the layering and bounded-context import rules
    dir: "{{.BACKEND}}"
    cmds:
      - uv run lint-imports
      - uv run pytest tests/architecture

  # --- contracts -----------------------------------------------------------
  contracts:generate:
    desc: Regenerate the typed API client from contracts/openapi
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm api:generate

  # `contracts:verify` is deliberately absent. It ran `api:generate` and failed
  # on a diff, but contracts/openapi/v1/openapi.yaml is an empty file — orval has
  # never produced any output, and every endpoint is a hand-written wrapper under
  # frontend/app/lib/contexts. Restore this task the moment that contract is
  # authored:
  #
  #   contracts:verify:
  #     dir: "{{.FRONTEND}}"
  #     cmds:
  #       - pnpm api:generate
  #       - git diff --exit-code app/lib/shared/api/generated
