# Install once per clone:
#   uv tool install pre-commit && pre-commit install
#
# Hooks are fast checks only. Type-checking and the test suites run in CI —
# putting them here makes every commit slow enough that people use --no-verify.

default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates are Go templates, not valid YAML until rendered.
        exclude: ^deploy/helm/.*/templates/
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: pnpm --dir frontend exec prettier --write
        language: system
        files: ^frontend/.*\.(ts|js|svelte|css|json|md)$
        exclude: ^frontend/src/lib/shared/api/generated/

      - id: no-env-files
        name: block committed .env files
        entry: .env files hold real credentials and must never be committed
        language: fail
        files: (^|/)\.env(\.|$)
        exclude: \.example$
